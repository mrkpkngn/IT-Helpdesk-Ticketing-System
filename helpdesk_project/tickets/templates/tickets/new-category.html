{% extends "../base.html" %}
{% load widget_tweaks %}
{%block title%} - New category {%endblock%}
{%block content%}
<div id="new-category" class="flex flex-col items-center justify-center p-6 gap-6">
<h1 class="text-2xl font-bold">New category</h1>
<form method="POST" action="#" class="grid grid-cols-1 grid-rows-2 items-center gap-2 w-full max-w-md">
    {% csrf_token %}
    <div class="flex flex-col w-full col-1 row-1 gap-2">
        <label for="Name" class="text-left label">Name</label>
        <input class="input bg-white" id="name-input" type="text" placeholder="Hardware, Software" name="name" id="name" value="{{ category_form.name.value|default:'' }}">
    </div>
    <div class="flex flex-col items-center justify-center w-full col-1 row-2">
        <input type="submit" value="Submit" class="btn w-full bg-blue-500"/>
    </div>
</form>
</div>
{%endblock%}
