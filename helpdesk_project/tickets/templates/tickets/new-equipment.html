{% extends "../base.html" %}
{% load widget_tweaks %}
{%block title%} - New equipment {%endblock%}
{%block content%}
<div id="new-equipment" class="flex flex-col items-center justify-center p-6 gap-6">
<h1 class="text-2xl font-bold">New equipment</h1>
<form method="POST" action="#" class="grid grid-cols-1 grid-rows-3 justify-center items-center gap-2 w-full max-w-md">
    {% csrf_token %}
    <div class="flex flex-col gap-2 justify-center w-full col-1 row-1">
        <label for="asset_tag" class="label">Asset Tag</label>
        <input class="input bg-white" id="name-input" type="text" placeholder="LT-2024-001" name="asset_tag" id="asset_tag" value="{{ equipment_form.asset_tag.value|default:'' }}">
    </div>
    <div class="flex flex-col gap-2 justify-center w-full col-1 row-2">
        <label for="equipment_type" class="label">Equipment Type</label>
        <input class="input bg-white" id="equipment_type" type="text" placeholder="Laptop" name="equipment_type" id="equipment_type" value="{{ equipment_form.equipment_type.value|default:'' }}">
    </div>
    <div class="flex flex-col items-center justify-center w-full col-1 row-3">
        <input type="submit" value="Submit" class="btn w-full bg-blue-500"/>
    </div>
</form>
</div>
{%endblock%}
