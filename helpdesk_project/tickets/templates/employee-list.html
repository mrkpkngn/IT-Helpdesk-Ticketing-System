{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto mt-10">
    <h1 class="text-3xl font-bold mb-6">Employee List</h1>
    
    <div class="border-slate-200 rounded-lg overflow-hidden border">
        <table class="table border-collapse border w-full rounded-lg overflow-hidden bg-white">
            <thead class="">
                <tr>
                    <th class="p-3 font-semibold text-slate-700 border-b border-slate-200">Name</th>
                    <th class="p-3 font-semibold text-slate-700 border-b border-slate-200">Username</th>
                    <th class="p-3 font-semibold text-slate-700 border-b border-slate-200">Department</th>
                    <th class="border-b border-slate-200"></th>
                </tr>
            </thead>
            <tbody>
                {% for employee in employees %}
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="p-3 font-medium">{{ employee.first_name }} {{ employee.last_name }}</td>
                    <td class="p-3 text-slate-600">{{ employee.username }}</td>
                    <td class="p-3 text-slate-600">{{ employee.department.name }}</td>
                    <td class="p-3 text-sm"><a href="{% url 'employee_details' employee.id %}"><i data-lucide="info" class="w-4 h-4 text-blue-500 hover:cursor-pointer"></a></i></td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="p-8 text-center text-slate-500 italic">
                        No tickets found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
