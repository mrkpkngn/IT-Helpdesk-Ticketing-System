[project]
name = "IT-Helpdesk-Ticketing-System"
version = "1.0.0"
description = "A Django-based IT support ticket management system for tracking and resolving employee issues"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "IT Department" }
]
keywords = ["django", "ticketing", "helpdesk", "support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Business/Enterprise",
    "License :: Other/Proprietary",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]
dependencies = [
    "Django==6.0.4",
    "django-widget-tweaks==1.4.12",
    "python-dateutil==2.8.2",
    "sqlparse==0.4.4",
    "asgiref==3.7.2",
    "typing-extensions==4.9.0",
]

[project.optional-dependencies]
dev = [
    "black==24.1.1",
    "flake8==7.0.0",
    "isort==5.13.2",
    "django-debug-toolbar==4.2.0",
]
prod = [
    "gunicorn==21.2.0",
    "whitenoise==6.6.0",
    "psycopg2-binary==2.9.9",
]

[project.urls]
Homepage = "https://github.com/yourusername/IT-Helpdesk-Ticketing-System"
Documentation = "https://github.com/yourusername/IT-Helpdesk-Ticketing-System/wiki"
Repository = "https://github.com/yourusername/IT-Helpdesk-Ticketing-System.git"
Issues = "https://github.com/yourusername/IT-Helpdesk-Ticketing-System/issues"

[tool.uv]
python-version = "3.11"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
